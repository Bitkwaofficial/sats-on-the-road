<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://api.coingecko.com" crossorigin>

<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="assets/favicon-192.png" sizes="192x192" type="image/png" />
<link rel="icon" href="assets/favicon-512.png" sizes="512x512" type="image/png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta name="author" content="Sats On The Road" />

<!-- SEO -->
<meta name="description" content="{{DESC}}" />
<meta name="keywords" content="Bitcoin Africa, Bitcoin adoption, Lightning Network, non-custodial wallet, financial inclusion, Sats On The Road, BitKwa" />
<link rel="canonical" href="{{CANONICAL}}" />
<link rel="alternate" hreflang="en" href="{{CANONICAL}}" />
<link rel="alternate" hreflang="fr" href="{{CANONICAL_FR}}" />
<link rel="alternate" hreflang="x-default" href="{{CANONICAL}}" />

<!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
<meta property="og:type" content="website" />
<meta property="og:locale" content="en_US" />
<meta property="og:site_name" content="Sats On The Road" />
<meta property="og:url" content="{{CANONICAL}}" />
<meta property="og:title" content="{{OGTITLE}}" />
<meta property="og:description" content="{{OGDESC}}" />
<meta property="og:image" content="https://satsontheroad.africa/assets/og-image.jpg" />
<meta property="og:image:secure_url" content="https://satsontheroad.africa/assets/og-image.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="The Sats On The Road wrapped car" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{OGTITLE}}" />
<meta name="twitter:description" content="{{OGDESC}}" />
<meta name="twitter:image" content="https://satsontheroad.africa/assets/og-image.jpg" />

<!-- Structured data -->
<script type="application/ld+json">
{{JSONLD}}
</script>
<script>window.SOTR_META = {{META_JSON}};</script>
</head>
<body data-page="{{PAGE}}">

{{TICKER}}

{{BODY}}
